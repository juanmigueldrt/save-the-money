name: Aplicar migraciones a Supabase

# Sólo corre al fusionar en main cambios de supabase/migrations y espera la
# aprobación manual de Jean en el entorno "produccion" (Settings > Environments).
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/deploy-db.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: produccion
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      # Desde la CLI 3.x, db push va contra la base local salvo --remote, y pide
      # confirmación salvo --yes (la aprobación del entorno produccion ya la da Jean).
      - run: supabase db push --remote --yes
