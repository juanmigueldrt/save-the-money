name: Medición de carga

# ORC-70: sólo a mano (Actions > Medición de carga > Run workflow). No corre en los PR.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Movimientos de prueba, separados por comas
        required: true
        default: '10000,50000'

permissions:
  contents: read

jobs:
  medicion:
    name: Movimientos, precios, operaciones y saldos contra el Supabase local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.0.0
      # Lo mismo que el job de Supabase de ci.yml: base de datos, auth, PostgREST y Kong.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # El valor va por variable de entorno, no pegado en el script: el propio script lo valida.
      # Después de cada tamaño imprime los planes (medicion_planes.sql, con el psql del runner): salen en el log
      # y, plegados, en el resumen del job.
      - name: Medir
        env:
          SIZES: ${{ inputs.sizes }}
        run: python3 supabase/tests/api/medicion_movimientos.py "$SIZES"
