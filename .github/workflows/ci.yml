name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Buscar secretos en todo el historial
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  core:
    name: STMCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path Packages/STMCore --enable-code-coverage
      - name: Cobertura de STMCore
        run: |
          BIN=$(swift build --package-path Packages/STMCore --show-bin-path)
          # En Linux el .xctest es el ejecutable de las pruebas (STMCorePackageTests.xctest).
          TESTS=$(ls -d "$BIN"/*.xctest | head -n 1)
          llvm-cov report "$TESTS" -instr-profile="$BIN/codecov/default.profdata" \
            -ignore-filename-regex='(/Tests/|/\.build/)' > coverage.txt
          LINES=$(awk '$1 == "TOTAL" { print $10 }' coverage.txt)
          {
            echo "### Cobertura de STMCore: $LINES de líneas"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  supabase:
    name: Supabase (migraciones y RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase db start
      - run: supabase test db

  apple:
    name: App (iOS y macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Preparar proyecto
        run: |
          brew install xcodegen
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate
      # El runner macos-15 no trae simuladores de iPhone instalados: se compila
      # para el simulador genérico y las pruebas corren en el Mac (mismo código).
      - name: Compilar para iPhone (simulador)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SaveTheMoney.xcodeproj -scheme SaveTheMoney \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Pruebas en Mac
        run: |
          set -o pipefail
          xcodebuild test \
            -project SaveTheMoney.xcodeproj -scheme SaveTheMoney \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify

  # Sin local.properties la depuración compila en modo demo: no hace falta ningún secreto.
  android:
    name: Android (pruebas, Lint y ktlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew testDebugUnitTest lintDebug
      - run: ./gradlew ktlintCheck

  # La línea base guarda rutas absolutas bajo /repo: por eso se monta ahí.
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/realm/swiftlint:0.65.0 lint --strict
