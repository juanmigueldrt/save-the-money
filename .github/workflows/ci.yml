name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos en todo el historial
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  core:
    name: STMCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/STMCore

  supabase:
    name: Supabase (migraciones y RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  apple:
    name: App (iOS y macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          brew install xcodegen
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate
      - name: Pruebas en el simulador de iPhone
        run: |
          set -o pipefail
          xcodebuild test \
            -project SaveTheMoney.xcodeproj -scheme SaveTheMoney \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit 1
      - name: Compilar para Mac
        run: |
          set -o pipefail
          xcodebuild build \
            -project SaveTheMoney.xcodeproj -scheme SaveTheMoney \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit 1
